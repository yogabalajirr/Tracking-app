version: "3.8"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: calorie_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/calorie_tracker
      JWT_SECRET: ${JWT_SECRET}
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - db
    ports:
      - "4000:4000"
volumes:
  postgres-data:



