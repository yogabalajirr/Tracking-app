<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Source of truth for the app icon. `npm run icon` rasterises this to
    build/icon.png, which electron-builder converts to .icns at package time.

    Drawn in the "Sharp edge" palette: a graphite ground with the two status
    hues doing the talking. The incoming message is neutral; the reply carries
    the mint, because a replied ticket is the good outcome. The red dot is the
    one unanswered thing — which is what a support queue is actually about.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1e1e1e"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#ground)"/>

  <!-- Incoming message: the palette's light grey, tail down-left -->
  <path
    d="M224 236 h448 a48 48 0 0 1 48 48 v224 a48 48 0 0 1 -48 48 h-300 l-96 84 v-84 h-52 a48 48 0 0 1 -48 -48 v-224 a48 48 0 0 1 48 -48 z"
    fill="#d9d9d9"/>

  <!-- Two lines of text in it, unequal so it reads as writing, not a table -->
  <rect x="248" y="330" width="376" height="36" rx="18" fill="#898989"/>
  <rect x="248" y="406" width="240" height="36" rx="18" fill="#898989"/>

  <!-- The unanswered marker -->
  <circle cx="742" cy="266" r="58" fill="#ff4d4d"/>

  <!-- The reply, in mint, tail down-right so the two never collide -->
  <path
    d="M408 612 h400 a48 48 0 0 1 48 48 v124 a48 48 0 0 1 -48 48 h-84 v76 l-88 -76 h-228 a48 48 0 0 1 -48 -48 v-124 a48 48 0 0 1 48 -48 z"
    fill="#4dffbc"/>
</svg>
