# Fly.io app configuration for backend
app = "calorie-tracker-backend-192-168-1-7"
primary_region = "ord"

[build]
# Uses your Dockerfile in backend/

[env]
NODE_ENV = "production"

[[services]]
internal_port = 8080
protocol = "tcp"
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

  [[services.ports]]
  handlers = ["http"]
  port = 80

  [[services.ports]]
  handlers = ["tls", "http"]
  port = 443

  [services.concurrency]
  type = "requests"
  soft_limit = 50
  hard_limit = 100

  [[services.http_checks]]
  interval = "10s"
  timeout = "2s"
  grace_period = "30s"
  method = "get"
  path = "/api/health"
  protocol = "http"

[checks]
  [checks.health]
  port = 8080
  type = "http"
  interval = "15s"
  timeout = "2s"
  method = "get"
  path = "/api/health"

